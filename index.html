<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masmorrada</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #14131f;
        font-family: system-ui, sans-serif;
        color: #e8e6f5;
      }

      /* ---------- fases ---------- */
      #stage { display: grid; place-items: center; gap: 10px; padding: 20px; }
      body[data-phase='menu'] #stage { display: none; }
      body[data-phase='combat'] #ui-root { display: none; }

      canvas {
        background: #0f0e17;
        border: 2px solid #2c2a40;
        border-radius: 8px;
        max-width: 92vw;
        max-height: 78vh;
      }
      #hud { display: flex; gap: 16px; font-size: 13px; color: #9b98b5; }
      #hud b { color: #e8e6f5; }
      .chip { border: 1px solid #2c2a40; border-radius: 999px; padding: 3px 10px; }

      /* ---------- telas de menu ---------- */
      #ui-root {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        display: grid;
        place-items: start center;
        background: radial-gradient(1200px 600px at 50% -10%, #251f3a, #14131f 70%);
      }
      .screen { width: min(860px, 94vw); padding: 40px 0 60px; text-align: center; }
      .title { margin: 0 0 6px; font-size: 30px; letter-spacing: 0.5px; }
      .subtitle { margin: 0 0 28px; color: #9b98b5; }

      .offer { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
      .card {
        display: grid;
        gap: 10px;
        padding: 16px;
        text-align: left;
        background: #1b1a28;
        border: 2px solid;
        border-radius: 14px;
        cursor: pointer;
        color: inherit;
        font: inherit;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); }
      .card-top { display: flex; align-items: center; gap: 10px; }
      .card-name { font-weight: 700; font-size: 20px; flex: 1; }
      .card-kind { color: #9b98b5; font-size: 13px; }
      .badge {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 2px 8px;
      }
      .disc {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #0f0e17;
        font-weight: 800;
        font-size: 20px;
        flex: none;
      }
      .card-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .card-stats .stat { display: grid; gap: 2px; text-align: center; background: #14131f; border-radius: 8px; padding: 6px 4px; }
      .stat-label { font-size: 10px; color: #9b98b5; text-transform: uppercase; letter-spacing: 0.6px; }
      .stat-value { font-size: 15px; }

      .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; margin-bottom: 26px; }
      .slots-col { display: grid; gap: 10px; }
      .slots-col-title { font-size: 12px; letter-spacing: 1px; color: #6f6b8a; text-transform: uppercase; text-align: left; padding-left: 4px; }
      .slot {
        text-align: left;
        background: #1b1a28;
        border: 2px solid #2c2a40;
        border-radius: 14px;
        padding: 14px;
        min-height: 150px;
        display: grid;
        gap: 8px;
      }
      .slot.empty { border-style: dashed; border-color: #3a3750; background: transparent; display: grid; place-items: center; color: #6f6b8a; font-size: 13px; gap: 4px; }
      .slot.empty.inline { min-height: 60px; }
      .slot-head { display: flex; justify-content: space-between; align-items: center; }
      .slot-idx { font-size: 11px; color: #6f6b8a; text-transform: uppercase; letter-spacing: 0.8px; }
      .slot-row { font-size: 11px; font-weight: 700; color: #9b98b5; text-transform: uppercase; letter-spacing: 0.8px; }
      .slot-body { display: flex; gap: 12px; }
      .slot-info { display: grid; gap: 4px; flex: 1; }
      .slot-name { font-weight: 700; }
      .slot-kind { color: #9b98b5; font-size: 12px; }
      .slot-actions { display: flex; gap: 8px; }

      .synergies { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 26px; }
      .synergy { border: 2px solid #2c2a40; border-radius: 12px; padding: 10px 12px; text-align: left; opacity: 0.55; display: grid; gap: 4px; }
      .synergy.active { opacity: 1; }
      .synergy-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .synergy-kind { font-weight: 700; font-size: 14px; }
      .synergy-status { font-size: 11px; color: #6f6b8a; text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap; }
      .synergy-status.on { color: #7dff8a; font-weight: 700; }
      .synergy-desc { font-size: 12px; color: #9b98b5; }

      .section-title { font-size: 12px; letter-spacing: 1px; color: #6f6b8a; text-transform: uppercase; text-align: left; margin-bottom: 10px; }
      .bench { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 26px; }
      .card.bench.assigned { opacity: 0.4; cursor: default; }
      .assigned-tag { font-size: 11px; color: #6f6b8a; text-transform: uppercase; letter-spacing: 0.6px; }

      .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
      .btn {
        background: #372f5c;
        color: #e8e6f5;
        border: 1px solid #4d4280;
        border-radius: 10px;
        font: inherit;
        font-size: 14px;
        padding: 10px 18px;
        cursor: pointer;
      }
      .btn:hover { background: #433972; }
      .btn.primary { background: #4f8cff; border-color: #6fa3ff; font-weight: 700; }
      .btn.primary:hover { background: #3f79e8; }
      .btn.small { font-size: 12px; padding: 6px 12px; }
      .btn.danger { border-color: #d4473b; color: #ff8d84; }
      .btn.danger:hover { background: #3a2624; }
    </style>
  </head>
  <body data-phase="menu">
    <div id="ui-root"></div>
    <main id="stage">
      <canvas id="game" width="800" height="800"></canvas>
      <div id="hud">
        <span class="chip">Placeholders: <b>jogador</b> (azul) vs <b>inimigos</b> (vermelho)</span>
        <span id="fps">— FPS</span>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
